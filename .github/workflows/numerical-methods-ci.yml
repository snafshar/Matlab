name: Numerical Methods CI

on:
  push:
    paths:
      - "projects/2026-10-19/numerical-methods/**"
      - ".github/workflows/numerical-methods-ci.yml"
  pull_request:
    paths:
      - "projects/2026-10-19/numerical-methods/**"
      - ".github/workflows/numerical-methods-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  octave-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: sudo apt-get update && sudo apt-get install --yes octave
      - name: Run regression tests
        working-directory: projects/2026-10-19/numerical-methods
        run: octave --no-gui --quiet --eval "test_numerical_methods();"
      - name: Run demo
        working-directory: projects/2026-10-19/numerical-methods
        run: octave --no-gui --quiet --eval "demo_numerical_methods;"
